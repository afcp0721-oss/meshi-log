name: Validate Meshi Log

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install authentication dependency
        run: npm ci --ignore-scripts
      - name: Check frontend JavaScript syntax
        run: node --check app.js
      - name: Check Worker JavaScript syntax
        run: cp worker.js /tmp/worker.mjs && node --check /tmp/worker.mjs
      - name: Test Worker flow and analysis contract
        run: node --test tests/*.test.mjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Test mobile history and optional actions
        run: node tests/browser-smoke.cjs
      - name: Verify product invariants
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const app = fs.readFileSync('app.js','utf8');
          const html = fs.readFileSync('index.html','utf8');
          const worker = fs.readFileSync('worker.js','utf8');
          const analysis = fs.readFileSync("analysis.mjs", "utf8");
          const wrangler = fs.readFileSync('wrangler.jsonc','utf8');
          const checks = [
            [app.includes('const MAX_PHOTOS = 3;'), 'frontend max photos is 3'],
            [html.includes('写真を選択（最大3枚）'), 'UI says max 3'],
            [!html.includes('1秒で完了'), 'no fake one-second promise'],
            [worker.includes('images.length < 1 || images.length > 3'), 'Worker enforces 1-3 images'],
            [worker.includes('WHERE user_id = ?'), 'history/context are user-scoped'],
            [!worker.includes('/api/generate'), 'no public Gemini proxy'],
            [worker.includes('env.DISCORD_WEBHOOK_URL'), 'Discord webhook stays server-side'],
            [worker.includes('url.pathname === "/api/image"'), 'Worker image proxy route exists'],
            [worker.includes('cdn.discordapp.com') && worker.includes('media.discordapp.net'), 'image proxy is restricted to Discord CDN'],
            [app.includes('/api/image?url='), 'history uses Worker image proxy'],
            [worker.includes('url.pathname === "/api/assist"'), 'assist API exists'],
            [worker.includes('meal_report') && analysis.includes('estimated_calories_min'), 'meal report includes calorie estimate'],
            [app.includes('𝕏 投稿下書き') && app.includes('めしレポ'), 'history exposes X draft and meal report actions'],
            [app.includes('twitter.com/intent/tweet'), 'X share uses intent URL'],
            [wrangler.includes('"binding": "DB"') && wrangler.includes('"database_name": "meshi-log-db"'), 'D1 binding present']
          ];
          let failed = false;
          for (const [ok, label] of checks) {
            console.log((ok ? 'PASS ' : 'FAIL ') + label);
            if (!ok) failed = true;
          }
          if (failed) process.exit(1);
          NODE
