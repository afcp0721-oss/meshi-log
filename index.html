<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>メシログ AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; }
    .card { background: #1e293b; border-radius: 14px; padding: 18px; border: 1px solid #334155; margin-bottom: 16px; }
    .title { font-size: 1.25rem; font-weight: 800; color: #f97316; margin-bottom: 6px; }
    .desc { font-size: 0.85rem; color: #94a3b8; margin-bottom: 16px; }
    label { font-size: 0.8rem; font-weight: 700; color: #cbd5e1; display: block; margin-bottom: 6px; }
    input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 12px; border-radius: 8px; font-size: 0.95rem; margin-bottom: 12px; }
    .chip-wrap { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .chip { background: #334155; color: #e2e8f0; font-size: 0.8rem; padding: 6px 12px; border-radius: 16px; cursor: pointer; border: 1px solid transparent; }
    .chip:active { background: #ea580c; }
    .btn-main { width: 100%; background: #ea580c; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; }
    .btn-main:disabled { background: #475569; opacity: 0.5; }
    .btn-x { background: #000; color: #fff; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; margin-top: 10px; }
    .bubble { background: #064e3b; border: 1px solid #059669; border-radius: 10px; padding: 12px; font-size: 0.88rem; color: #6ee7b7; line-height: 1.4; margin-bottom: 16px; }
    .alert-box { background: #7f1d1d; border: 1px solid #dc2626; color: #fca5a5; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; display: none; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
    .preview-thumb { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; border: 1px solid #475569; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- ================= オンボーディング画面 ================= -->
  <div id="onboardingCard" class="card" style="display: none;">
    <div class="title">🤝 相棒を決めよう</div>
    <div class="desc">これからあなたの食事と生活を記録する専属AIの呼び名と、あなたの呼ばれ方を設定します。</div>

    <label>AIの名前（呼び名）</label>
    <input type="text" id="aiNameInput" placeholder="例：メシ友, 相棒" value="相棒">

    <div class="chip-wrap" style="margin-bottom: 12px;">
      <span class="chip" onclick="setAiName('相棒')">相棒</span>
      <span class="chip" onclick="setAiName('メシ友')">メシ友</span>
      <span class="chip" onclick="setAiName('めしログ君')">めしログ君</span>
      <span class="chip" onclick="setAiName('バディ')">バディ</span>
    </div>

    <label>あなたの呼ばれ方</label>
    <input type="text" id="userCallInput" placeholder="例：ボス, 隊長" value="ボス">

    <div class="chip-wrap">
      <span class="chip" onclick="setCall('ボス')">ボス</span>
      <span class="chip" onclick="setCall('隊長')">隊長</span>
      <span class="chip" onclick="setCall('アニキ')">アニキ</span>
      <span class="chip" onclick="setCall('マスター')">マスター</span>
    </div>

    <button class="btn-main" onclick="saveRelationship()">この設定でスタート！</button>
  </div>

  <div id="mainCard" class="card" style="display: none;">
    <div id="aiVoiceBubble" class="bubble"></div>

    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" onchange="handleImages(event)">
    <button class="btn-main" onclick="document.getElementById('fileInput').click()">📷 写真を撮る / 選ぶ</button>

    <div id="previewGrid" class="grid"></div>
    <div id="safetyAlert" class="alert-box"></div>

    <div id="resultSection" style="display: none; margin-top: 16px;">
      <label>📱 X用ポスト（微修正するとAIが学習）</label>
      <textarea id="xPostText" rows="4" style="width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 10px;"></textarea>

      <a id="xShareBtn" class="btn-x" href="#" target="_blank">𝕏 でポストする</a>
      <button class="btn-main" style="background: #2563eb; margin-top: 8px;" onclick="saveToCloudAndDiscord()">💾 Discord & クラウドに記録</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
