<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>メシログ AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 16px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; }
    .card { background: #1e293b; border-radius: 14px; padding: 18px; border: 1px solid #334155; margin-bottom: 16px; position: relative; }
    .title { font-size: 1.2rem; font-weight: 800; color: #f97316; margin-bottom: 6px; }
    .desc { font-size: 0.85rem; color: #94a3b8; margin-bottom: 14px; }
    .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn-gear { background: transparent; border: 1px solid #475569; color: #cbd5e1; border-radius: 8px; padding: 4px 8px; font-size: 0.8rem; cursor: pointer; }
    label { font-size: 0.8rem; font-weight: 700; color: #cbd5e1; display: block; margin: 10px 0 4px; }
    input[type="text"] { width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.95rem; }
    .chip-wrap { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .chip { background: #334155; color: #e2e8f0; font-size: 0.8rem; padding: 6px 12px; border-radius: 16px; cursor: pointer; border: 1px solid transparent; }
    .chip.active { background: #ea580c; color: #fff; font-weight: bold; }
    .btn-main { width: 100%; background: #ea580c; color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .btn-sub { width: 100%; background: transparent; color: #94a3b8; border: 1px solid #475569; padding: 10px; border-radius: 8px; font-size: 0.85rem; cursor: pointer; margin-top: 8px; }
    .btn-x { background: #000; color: #fff; border: 1px solid #334155; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; margin-top: 10px; }
    .bubble { background: #064e3b; border: 1px solid #059669; border-radius: 10px; padding: 12px; font-size: 0.88rem; color: #6ee7b7; line-height: 1.4; margin-bottom: 12px; }
    .alert-box { background: #7f1d1d; border: 1px solid #dc2626; color: #fca5a5; padding: 10px; border-radius: 8px; font-size: 0.82rem; margin-bottom: 10px; display: none; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
    .thumb-box { position: relative; width: 100%; aspect-ratio: 1/1; }
    .preview-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; border: 1px solid #475569; }
    .del-badge { position: absolute; top: 4px; right: 4px; background: rgba(220, 38, 38, 0.9); color: #fff; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

<div class="app-container">
  <!-- オンボーディング・設定モーダル -->
  <div id="settingsCard" class="card" style="display: none;">
    <div class="title">🤝 相棒とあなたの呼び名</div>
    <div class="desc">いつでも後から変更できます。</div>

    <label>AIの名前</label>
    <input type="text" id="aiNameInput" placeholder="例：相棒, メシ友" value="相棒">
    <div class="chip-wrap">
      <span class="chip" onclick="setAiName('相棒')">相棒</span>
      <span class="chip" onclick="setAiName('メシ友')">メシ友</span>
      <span class="chip" onclick="setAiName('めしログ君')">めしログ君</span>
      <span class="chip" onclick="setAiName('バディ')">バディ</span>
    </div>

    <label>あなたの呼ばれ方</label>
    <input type="text" id="userCallInput" placeholder="例：ボス, 隊長" value="ボス">
    <div class="chip-wrap">
      <span class="chip" onclick="setCall('ボス')">ボス</span>
      <span class="chip" onclick="setCall('隊長')">隊長</span>
      <span class="chip" onclick="setCall('アニキ')">アニキ</span>
      <span class="chip" onclick="setCall('マスター')">マスター</span>
    </div>

    <button class="btn-main" onclick="saveRelationship()">設定を保存する</button>
    <button class="btn-sub" id="btnSkip" onclick="skipSettings()">あとで決める（スキップ）</button>
  </div>

  <!-- メイン操作画面 -->
  <div id="mainCard" class="card">
    <div class="header-bar">
      <span id="headerAiTitle" style="font-size: 0.85rem; font-weight: bold; color: #94a3b8;">専属AI: 相棒</span>
      <button class="btn-gear" onclick="openSettings()">⚙️ 設定変更</button>
    </div>

    <div id="aiVoiceBubble" class="bubble"></div>

    <!-- 気分選択チップ -->
    <label>今日の気分（任意）</label>
    <div class="chip-wrap" id="moodChips">
      <span class="chip active" onclick="selectMood(this, '最高')">😋 最高</span>
      <span class="chip" onclick="selectMood(this, 'ガッツリ')">💪 ガッツリ</span>
      <span class="chip" onclick="selectMood(this, 'ヘルシー')">🥗 ヘルシー</span>
      <span class="chip" onclick="selectMood(this, 'サクッと')">⚡ サクッと</span>
      <span class="chip" onclick="selectMood(this, 'ご褒美')">✨ ご褒美</span>
    </div>

    <!-- ポストの長さ切り替え -->
    <label>X投稿の文字量</label>
    <div class="chip-wrap" id="lengthChips">
      <span class="chip active" onclick="selectLength(this, 'short')">短文（80字前後）</span>
      <span class="chip" onclick="selectLength(this, 'long')">長文（200字詳細）</span>
    </div>

    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" onchange="handleImages(event)">
    <button class="btn-main" onclick="document.getElementById('fileInput').click()">📷 写真を撮る / 選ぶ（最大6枚）</button>

    <div id="previewGrid" class="grid"></div>
    <div id="safetyAlert" class="alert-box"></div>

    <button id="btnAnalyze" class="btn-main" style="display: none; background: #059669;" onclick="analyzeImages()">🔍 この写真で解析する</button>

    <!-- 結果エリア -->
    <div id="resultSection" style="display: none; margin-top: 14px;">
      <label>📱 X用ポスト文（修正するとAIが好みを学習）</label>
      <textarea id="xPostText" rows="4" style="width: 100%; background: #0f172a; border: 1px solid #475569; color: #fff; padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 8px;"></textarea>

      <a id="xShareBtn" class="btn-x" href="#" target="_blank">𝕏 でポストする</a>
      <button class="btn-main" style="background: #2563eb;" onclick="saveToCloudAndDiscord()">💾 クラウド＆Discordに記録してリセット</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
