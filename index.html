<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メシログ & ライフログ AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; color: #1e293b; padding: 16px; display: flex; justify-content: center; }
    .app-card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; text-align: center; }
    .sub { font-size: 0.8rem; color: #64748b; text-align: center; margin-bottom: 16px; }

    .step-title { font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .badge { background: #ea580c; color: #fff; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }

    .upload-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; background: #f8fafc; margin-bottom: 12px; }
    .upload-zone input { display: none; }
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .preview-thumb { width: 100%; height: 75px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; }

    .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag-btn { border: 1px solid #cbd5e1; background: #ffffff; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .tag-btn.active { background: #ea580c; color: #ffffff; border-color: #ea580c; font-weight: 700; }

    .style-row { display: flex; gap: 6px; margin-bottom: 16px; }
    .style-btn { flex: 1; border: 1px solid #cbd5e1; background: #ffffff; padding: 7px 4px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; text-align: center; color: #475569; }
    .style-btn.active { background: #0f172a; color: #ffffff; border-color: #0f172a; font-weight: 700; }

    .btn-main { width: 100%; background: #ea580c; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3); }
    .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

    .spinner-wrap { text-align: center; margin-top: 16px; display: none; }
    .spinner { width: 28px; height: 28px; border: 3px solid #fdba74; border-top-color: #ea580c; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #ea580c; font-size: 0.85rem; font-weight: 700; }

    .result-section { margin-top: 20px; display: none; }
    .detected-mode { font-size: 0.75rem; font-weight: 700; color: #ea580c; background: #fff7ed; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    
    .box-title { font-size: 0.8rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .output-box { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 0.85rem; line-height: 1.5; color: #0f172a; resize: vertical; margin-bottom: 8px; background: #fafafa; }
    
    .action-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn-sub { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer; text-align: center; }
    .btn-copy { background: #e2e8f0; color: #1e293b; }
    .btn-discord { background: #5865F2; color: #ffffff; }

    /* 設定エリア */
    .settings-details { margin-top: 24px; border-top: 1px dashed #cbd5e1; padding-top: 12px; }
    .settings-summary { font-size: 0.75rem; color: #64748b; cursor: pointer; outline: none; }
    .settings-content { margin-top: 8px; }
    .settings-input { width: 100%; font-size: 0.75rem; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 6px; }
  </style>
</head>
<body>

<div class="app-card">
  <h1>メシログ & ライフログ</h1>
  <div class="sub">写真を選ぶだけでAIが自動判別して投稿作成</div>

  <div class="step-title"><span class="badge">1</span> 写真を選ぶ（最大6枚・複数選択可）</div>
  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <span id="uploadText">📷 タップして写真を選択（最大6枚）</span>
    <input type="file" id="fileInput" accept="image/*" multiple onchange="handleMultipleImages(event)">
    <div id="previewGrid" class="preview-grid"></div>
  </div>

  <div class="step-title"><span class="badge">2</span> 気分 ＆ 文体スタイル</div>
  <div class="tag-container" id="tagList">
    <button class="tag-btn active" onclick="selectTag(this)">🔥 最高！</button>
    <button class="tag-btn" onclick="selectTag(this)">😋 うまい</button>
    <button class="tag-btn" onclick="selectTag(this)">☕ まったり</button>
    <button class="tag-btn" onclick="selectTag(this)">✨ 絶景・爽快</button>
    <button class="tag-btn" onclick="selectTag(this)">👍 リピ確定</button>
  </div>

  <div class="style-row">
    <button class="style-btn" data-style="natural" onclick="selectStyle(this)">🌿 スマート</button>
    <button class="style-btn" data-style="dandy" onclick="selectStyle(this)">🕶️ ダンディ</button>
    <button class="style-btn" data-style="lady" onclick="selectStyle(this)">🌸 軽やかレディ</button>
  </div>

  <div class="step-title"><span class="badge">3</span> AIで同時生成</div>
  <button id="generateBtn" class="btn-main" onclick="generatePosts()" disabled>AIでコメントを作成する</button>

  <div id="spinnerWrap" class="spinner-wrap">
    <div class="spinner"></div>
    <div id="loadingText" class="loading-text">最大6枚を圧縮・解析中...</div>
  </div>

  <div id="resultSection" class="result-section">
    <span id="detectedMode" class="detected-mode">🏷️ 自動判別中</span>

    <div class="box-title">📱 X用（短文・130字以内）</div>
    <textarea id="shortText" class="output-box" rows="4"></textarea>

    <div class="box-title">📝 詳細アーカイブ用（制限なし長文）</div>
    <textarea id="longText" class="output-box" rows="7"></textarea>

    <div class="action-row">
      <button class="btn-sub btn-copy" onclick="copyBoth()">📋 コピーする</button>
      <button id="discordBtn" class="btn-sub btn-discord" onclick="sendToDiscord()">💬 Discordへ保存</button>
    </div>
  </div>

  <!-- Discord Webhook 設定 -->
  <details class="settings-details">
    <summary class="settings-summary">⚙️ 保存先設定（Discord Webhook）</summary>
    <div class="settings-content">
      <input type="text" id="discordWebhookInput" class="settings-input" placeholder="Discord Webhook URL を貼り付け" onchange="saveWebhookUrl(this.value)">
      <div style="font-size: 0.7rem; color: #94a3b8;">※一度入力するとスマホに保存され、次から自動でこのチャンネルに保管されます。</div>
    </div>
  </details>
</div>

<script>
  const GEMINI_API_KEY = "AQ.Ab8RN6LVXXZj29RRtBS9eX4yFZIEtpAAKWxsrTgh8hhUp1uy-Q";
  let imagesData = [];
  let selectedTag = "🔥 最高！";
  let selectedStyle = localStorage.getItem('user_post_style') || 'natural';
  let currentCategory = "";

  window.addEventListener('DOMContentLoaded', () => {
    const target = document.querySelector(`.style-btn[data-style="${selectedStyle}"]`) || document.querySelector('.style-btn');
    if (target) selectStyle(target);

    const savedWebhook = localStorage.getItem('discord_webhook_url');
    if (savedWebhook) {
      document.getElementById('discordWebhookInput').value = savedWebhook;
    }
  });

  function saveWebhookUrl(val) {
    localStorage.setItem('discord_webhook_url', val.trim());
  }

  function selectTag(btn) {
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTag = btn.innerText;
  }

  function selectStyle(btn) {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStyle = btn.getAttribute('data-style');
    localStorage.setItem('user_post_style', selectedStyle);
  }

  // クライアント側で画像を軽量化（長辺1200px・JPEG圧縮）
  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          resolve({
            dataUrl: dataUrl,
            base64: dataUrl.split(',')[1],
            mimeType: 'image/jpeg'
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handleMultipleImages(event) {
    // 最大6枚
    const files = Array.from(event.target.files).slice(0, 6);
    if (!files.length) return;

    imagesData = [];
    const grid = document.getElementById('previewGrid');
    grid.innerHTML = '';

    for (const f of files) {
      const comp = await compressImage(f);
      imagesData.push(comp);

      const thumb = document.createElement('img');
      thumb.src = comp.dataUrl;
      thumb.className = 'preview-thumb';
      grid.appendChild(thumb);
    }

    document.getElementById('uploadText').innerText = `📷 ${imagesData.length}枚選択中（タップで変更）`;
    document.getElementById('generateBtn').disabled = false;
  }

  async function generatePosts() {
    if (!imagesData.length) return;

    const btn = document.getElementById('generateBtn');
    const spinnerWrap = document.getElementById('spinnerWrap');
    const resultSection = document.getElementById('resultSection');

    btn.disabled = true;
    spinnerWrap.style.display = 'block';
    resultSection.style.display = 'none';

    let styleRule = "";
    if (selectedStyle === 'dandy') {
      styleRule = "落ち着いた大人の男目線。「〜だ」「〜だな」といった静かな味わい深さやこだわりを重視。";
    } else if (selectedStyle === 'lady') {
      styleRule = "明るく軽やかな共感トーン。「〜♪」「〜でした！」といった親しみやすく華やかな表現。";
    } else {
      styleRule = "性別を問わないスマートで上質なトーン。感情を押しつけず、情景と良さを素直に伝える表現。";
    }

    const promptText = `
あなたはユーザー本人の代わりにSNS投稿を作成するゴーストライターAIです。
渡された写真（最大6枚）の全体を総合的に把握し、ユーザーが投稿する自然な文章を作成してください。
出力は指定のJSONフォーマットのみで行ってください。

【1. 主役判定と複数枚の統合】
- 看板、外観、料理、人物、風景などが混在している場合は全体を1つのストーリーとして統合してください。
- 人物が写っている場合は、料理があっても「楽しそうな食事会・団らんのひとコマ」を優先してください。
- 写真に写っていない味や架空のメニューを勝手に捏造しないでください。

【2. 執筆ルール】
- 気分タグ: "${selectedTag}"
- 文体指示: ${styleRule}
- 視点: 必ず投稿者本人のつぶやき目線。「〜ですね」「お疲れ様です」といったAIからの話しかけ口調は厳禁。

【3. 出力フォーマット】
以下のキーを持つ純粋なJSONのみを返してください（Markdownブロック不要）。
{
  "category": "食レポ または 風景・旅 または 人物・団らん または 日常",
  "short_text": "X用ポスト。120〜130文字以内。ハッシュタグ付き。",
  "long_text": "詳細アーカイブ文。ブログや記録用の自然な長文。"
}
`;

    const parts = [{ text: promptText }];
    imagesData.forEach(img => {
      parts.push({
        inline_data: {
          mime_type: img.mimeType,
          data: img.base64
        }
      });
    });

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts }] })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error ? errorData.error.message : "API通信エラー");
      }

      const data = await response.json();
      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const result = JSON.parse(rawText);

      currentCategory = result.category;
      document.getElementById('detectedMode').innerText = `🏷️ 自動判別: ${result.category}モード`;
      document.getElementById('shortText').value = result.short_text;
      document.getElementById('longText').value = result.long_text;

      resultSection.style.display = 'block';
    } catch (err) {
      alert("エラー詳細: " + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
      spinnerWrap.style.display = 'none';
    }
  }

  function copyBoth() {
    const shortVal = document.getElementById('shortText').value;
    const longVal = document.getElementById('longText').value;
    const combined = `【X用】\n${shortVal}\n\n【詳細ログ】\n${longVal}`;
    navigator.clipboard.writeText(combined);
    alert("短文と長文の両方をコピーしました！");
  }

  async function sendToDiscord() {
    const webhookUrl = localStorage.getItem('discord_webhook_url');
    if (!webhookUrl) {
      alert("画面下の『保存先設定』に Discord の Webhook URL を入力してください。");
      return;
    }

    const shortVal = document.getElementById('shortText').value;
    const longVal = document.getElementById('longText').value;
    const btn = document.getElementById('discordBtn');
    btn.disabled = true;
    btn.innerText = "送信中...";

    const payload = {
      embeds: [{
        title: `📸 ${currentCategory}ログ（${selectedTag}）`,
        color: 15339532, // オレンジ系カラー
        fields: [
          { name: "📱 X用（短文）", value: shortVal || "なし" },
          { name: "📝 詳細アーカイブ（長文）", value: longVal || "なし" }
        ],
        footer: { text: `画像 ${imagesData.length} 枚を解析 | ${new Date().toLocaleString()}` }
      }]
    };

    try {
      const res = await fetch(webhookUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error("Discord送信エラー");
      alert("Discordへの保存が完了しました！");
    } catch (e) {
      alert("Discord送信に失敗しました。Webhook URLを確認してください。");
    } finally {
      btn.disabled = false;
      btn.innerText = "💬 Discordへ保存";
    }
  }
</script>

</body>
</html>
