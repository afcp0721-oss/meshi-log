<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メシログ & ライフログ AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; color: #1e293b; padding: 16px; display: flex; justify-content: center; }
    .app-card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; text-align: center; }
    .sub { font-size: 0.8rem; color: #64748b; text-align: center; margin-bottom: 16px; }

    .step-title { font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .badge { background: #ea580c; color: #fff; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }

    .upload-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 14px; text-align: center; cursor: pointer; background: #f8fafc; margin-bottom: 12px; }
    .upload-zone input { display: none; }
    .preview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .preview-thumb { width: 100%; height: 75px; object-fit: cover; border-radius: 6px; border: 1px solid #cbd5e1; }

    .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .tag-btn { border: 1px solid #cbd5e1; background: #ffffff; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .tag-btn.active { background: #ea580c; color: #ffffff; border-color: #ea580c; font-weight: 700; }

    .style-row { display: flex; gap: 6px; margin-bottom: 16px; }
    .style-btn { flex: 1; border: 1px solid #cbd5e1; background: #ffffff; padding: 7px 4px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; text-align: center; color: #475569; }
    .style-btn.active { background: #0f172a; color: #ffffff; border-color: #0f172a; font-weight: 700; }

    .btn-main { width: 100%; background: #ea580c; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3); }
    .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

    .learn-badge-row { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; margin-bottom: 4px; }
    .learn-status { font-size: 0.7rem; color: #0284c7; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .btn-reset-learn { background: none; border: none; font-size: 0.65rem; color: #94a3b8; cursor: pointer; text-decoration: underline; }

    .spinner-wrap { text-align: center; margin-top: 16px; display: none; }
    .spinner { width: 28px; height: 28px; border: 3px solid #fdba74; border-top-color: #ea580c; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #ea580c; font-size: 0.85rem; font-weight: 700; }

    .result-section { margin-top: 20px; display: none; }
    .detected-mode { font-size: 0.75rem; font-weight: 700; color: #ea580c; background: #fff7ed; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    
    .box-title { font-size: 0.8rem; font-weight: 700; color: #334155; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
    .edit-hint { font-size: 0.65rem; font-weight: normal; color: #ea580c; }
    .output-box { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 0.85rem; line-height: 1.5; color: #0f172a; resize: vertical; margin-bottom: 8px; background: #fafafa; }
    
    .action-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn-sub { flex: 1; padding: 10px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer; text-align: center; }
    .btn-copy { background: #e2e8f0; color: #1e293b; }
    .btn-discord { background: #5865F2; color: #ffffff; }

    /* 過去ログエリア */
    .history-section { margin-top: 28px; border-top: 1px solid #e2e8f0; padding-top: 16px; }
    .history-summary { font-size: 0.85rem; font-weight: 700; color: #475569; cursor: pointer; outline: none; list-style: none; display: flex; justify-content: space-between; align-items: center; }
    .history-summary::-webkit-details-marker { display: none; }
    .history-list { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
    .history-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; }
    .history-header { display: flex; justify-content: space-between; font-size: 0.7rem; color: #64748b; margin-bottom: 6px; }
    .history-badge { background: #fed7aa; color: #9a3412; font-weight: 700; padding: 2px 6px; border-radius: 4px; }
    .history-text { font-size: 0.8rem; color: #1e293b; line-height: 1.4; margin-bottom: 8px; max-height: 60px; overflow-y: auto; }
    .history-btn-row { display: flex; justify-content: flex-end; gap: 6px; }
    .btn-mini-copy { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 4px 8px; font-size: 0.7rem; cursor: pointer; color: #334155; }
    .btn-mini-clear { background: none; border: none; color: #94a3b8; font-size: 0.7rem; cursor: pointer; text-decoration: underline; margin-top: 8px; text-align: right; display: block; width: 100%; }
  </style>
</head>
<body>

<div class="app-card">
  <h1>メシログ & ライフログ</h1>
  <div class="sub">写真を選ぶだけでAIが自動判別して投稿作成</div>

  <div class="step-title"><span class="badge">1</span> 写真を選ぶ（最大6枚・複数選択可）</div>
  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <span id="uploadText">📷 タップして写真を選択（最大6枚）</span>
    <input type="file" id="fileInput" accept="image/*" multiple onchange="handleMultipleImages(event)">
    <div id="previewGrid" class="preview-grid"></div>
  </div>

  <div class="step-title"><span class="badge">2</span> 気分 ＆ 文体スタイル</div>
  <div class="tag-container" id="tagList">
    <button class="tag-btn active" onclick="selectTag(this)">🔥 最高！</button>
    <button class="tag-btn" onclick="selectTag(this)">😋 うまい</button>
    <button class="tag-btn" onclick="selectTag(this)">☕ まったり</button>
    <button class="tag-btn" onclick="selectTag(this)">✨ 絶景・爽快</button>
    <button class="tag-btn" onclick="selectTag(this)">👍 リピ確定</button>
  </div>

  <div class="style-row">
    <button class="style-btn" data-style="natural" onclick="selectStyle(this)">🌿 スマート</button>
    <button class="style-btn" data-style="dandy" onclick="selectStyle(this)">🕶️ ダンディ</button>
    <button class="style-btn" data-style="lady" onclick="selectStyle(this)">🌸 軽やかレディ</button>
  </div>

  <div class="step-title"><span class="badge">3</span> AIで同時生成</div>
  <button id="generateBtn" class="btn-main" onclick="generatePosts()" disabled>AIでコメントを作成する</button>

  <div class="learn-badge-row">
    <span id="learnStatus" class="learn-status">🧠 文体学習: 未学習（使うほど育ちます）</span>
    <button id="resetLearnBtn" class="btn-reset-learn" onclick="resetLearnedStyle()" style="display: none;">学習リセット</button>
  </div>

  <div id="spinnerWrap" class="spinner-wrap">
    <div class="spinner"></div>
    <div id="loadingText" class="loading-text">最大6枚を圧縮・解析中...</div>
  </div>

  <div id="resultSection" class="result-section">
    <span id="detectedMode" class="detected-mode">🏷️ 自動判別中</span>

    <div class="box-title">
      <span>📱 X用（短文・130字以内）</span>
      <span class="edit-hint">※直して保存するとAIが好みを学習します</span>
    </div>
    <textarea id="shortText" class="output-box" rows="4"></textarea>

    <div class="box-title">
      <span>📝 詳細アーカイブ用（制限なし長文）</span>
    </div>
    <textarea id="longText" class="output-box" rows="7"></textarea>

    <div class="action-row">
      <button class="btn-sub btn-copy" onclick="copyBoth()">📋 コピーする</button>
      <button id="discordBtn" class="btn-sub btn-discord" onclick="sendToDiscord()">💬 Discordへ保存</button>
    </div>
  </div>

  <!-- 過去ログ閲覧エリア -->
  <details class="history-section" id="historyDetails">
    <summary class="history-summary">
      <span>📂 スマホ内の過去ログ履歴</span>
      <span id="historyCountBadge" style="font-size: 0.75rem; color: #ea580c;">0件</span>
    </summary>
    <div class="history-list" id="historyList"></div>
    <button class="btn-mini-clear" onclick="clearHistory()">履歴をすべてクリア</button>
  </details>
</div>

<script>
  const GEMINI_API_KEY = "AQ.Ab8RN6LVXXZj29RRtBS9eX4yFZIEtpAAKWxsrTgh8hhUp1uy-Q";
  const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1547649328829702236/wooY6kICkkTKbD4X00lIS2pQ6oBiizT1bjenjW51f8tbcC5pyA-fBqX3KviiGMnEuwIS";

  let imagesData = [];
  let selectedTag = "🔥 最高！";
  let selectedStyle = localStorage.getItem('user_post_style') || 'natural';
  let currentCategory = "";

  window.addEventListener('DOMContentLoaded', () => {
    const target = document.querySelector(`.style-btn[data-style="${selectedStyle}"]`) || document.querySelector('.style-btn');
    if (target) selectStyle(target);
    renderHistory();
    updateLearnStatusUI();
  });

  function selectTag(btn) {
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTag = btn.innerText;
  }

  function selectStyle(btn) {
    document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedStyle = btn.getAttribute('data-style');
    localStorage.setItem('user_post_style', selectedStyle);
  }

  function updateLearnStatusUI() {
    const examples = JSON.parse(localStorage.getItem('my_ai_style_examples') || '[]');
    const statusEl = document.getElementById('learnStatus');
    const resetBtn = document.getElementById('resetLearnBtn');

    if (examples.length === 0) {
      statusEl.innerText = "🧠 文体学習: 0件（修正保存でオレ専用に成長）";
      statusEl.style.color = "#64748b";
      resetBtn.style.display = "none";
    } else {
      statusEl.innerText = `🧠 文体学習中: ${examples.length}件の好みを反映中`;
      statusEl.style.color = "#0284c7";
      resetBtn.style.display = "inline";
    }
  }

  function resetLearnedStyle() {
    if (confirm("学習した文体データをリセットしますか？")) {
      localStorage.removeItem('my_ai_style_examples');
      updateLearnStatusUI();
      alert("文体学習をリセットしました。");
    }
  }

  // ユーザーが手動で編集・確定した文章をお手本として最大5件記憶
  function recordUserStyleExample(shortText, longText) {
    try {
      let examples = JSON.parse(localStorage.getItem('my_ai_style_examples') || '[]');
      // 重複チェック
      if (!examples.some(ex => ex.short === shortText)) {
        examples.unshift({ short: shortText, long: longText, date: new Date().toISOString() });
        if (examples.length > 5) examples.pop(); // 最新5件を保持
        localStorage.setItem('my_ai_style_examples', JSON.stringify(examples));
        updateLearnStatusUI();
      }
    } catch (e) {
      console.warn("文体サンプルの保存に失敗しました", e);
    }
  }

  function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1200;
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
          resolve({
            dataUrl: dataUrl,
            base64: dataUrl.split(',')[1],
            mimeType: 'image/jpeg'
          });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handleMultipleImages(event) {
    const files = Array.from(event.target.files).slice(0, 6);
    if (!files.length) return;

    imagesData = [];
    const grid = document.getElementById('previewGrid');
    grid.innerHTML = '';

    for (const f of files) {
      const comp = await compressImage(f);
      imagesData.push(comp);

      const thumb = document.createElement('img');
      thumb.src = comp.dataUrl;
      thumb.className = 'preview-thumb';
      grid.appendChild(thumb);
    }

    document.getElementById('uploadText').innerText = `📷 ${imagesData.length}枚選択中（タップで変更）`;
    document.getElementById('generateBtn').disabled = false;
  }

  async function generatePosts() {
    if (!imagesData.length) return;

    const btn = document.getElementById('generateBtn');
    const spinnerWrap = document.getElementById('spinnerWrap');
    const resultSection = document.getElementById('resultSection');

    btn.disabled = true;
    spinnerWrap.style.display = 'block';
    resultSection.style.display = 'none';

    let styleRule = "";
    if (selectedStyle === 'dandy') {
      styleRule = "落ち着いた大人の男目線。「〜だ」「〜だな」といった静かな味わい深さやこだわりを重視。";
    } else if (selectedStyle === 'lady') {
      styleRule = "明るく軽やかな共感トーン。「〜♪」「〜でした！」といった親しみやすく華やかな表現。";
    } else {
      styleRule = "性別を問わないスマートで上質なトーン。感情を押しつけず、情景と良さを素直に伝える表現。";
    }

    // 学習済みのお手本を取り出してプロンプトに注入
    const examples = JSON.parse(localStorage.getItem('my_ai_style_examples') || '[]');
    let personalizedPrompt = "";
    if (examples.length > 0) {
      personalizedPrompt = `
【最重要：ユーザー専用の文体学習（お手本）】
以下はユーザー本人が過去に手動修正して気に入った投稿の具体例です。
このユーザー特有の「語尾、句読点、言葉のリズム、絵文字の使い方」を徹底的に真似して作成してください。
${examples.map((ex, i) => `[お手本${i + 1}]\n短文: ${ex.short}\n長文: ${ex.long}`).join('\n\n')}
`;
    }

    const promptText = `
あなたはユーザー本人の代わりにSNS投稿を作成するゴーストライターAIです。
渡された写真（最大6枚）の全体を総合的に把握し、ユーザー本人が投稿する自然な文章を作成してください。
出力は指定のJSONフォーマットのみで行ってください。

【1. 主役判定と複数枚の統合】
- 看板、外観、料理、人物、風景などが混在している場合は全体を1つのストーリーとして統合してください。
- 人物が写っている場合は、料理があっても「楽しそうな食事会・団らんのひとコマ」を優先してください。
- 写真に写っていない味や架空のメニューを勝手に捏造しないでください。

【2. 執筆ルール】
- 気分タグ: "${selectedTag}"
- 基本文体指示: ${styleRule}
- 視点: 必ず投稿者本人のつぶやき目線。「〜ですね」「お疲れ様です」といったAIからの話しかけ口調は厳禁。
${personalizedPrompt}

【3. 出力フォーマット】
以下のキーを持つ純粋なJSONのみを返してください（Markdownブロック不要）。
{
  "category": "食レポ または 風景・旅 または 人物・団らん または 日常",
  "short_text": "X用ポスト。120〜130文字以内。ハッシュタグ付き。",
  "long_text": "詳細アーカイブ文。ブログや記録用の自然な長文。"
}
`;

    const parts = [{ text: promptText }];
    imagesData.forEach(img => {
      parts.push({
        inline_data: {
          mime_type: img.mimeType,
          data: img.base64
        }
      });
    });

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ parts }] })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error ? errorData.error.message : "API通信エラー");
      }

      const data = await response.json();
      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const result = JSON.parse(rawText);

      currentCategory = result.category;
      document.getElementById('detectedMode').innerText = `🏷️ 自動判別: ${result.category}モード`;
      document.getElementById('shortText').value = result.short_text;
      document.getElementById('longText').value = result.long_text;

      saveToLocalHistory({
        date: new Date().toLocaleString([], { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
        category: result.category,
        short_text: result.short_text,
        long_text: result.long_text,
        tag: selectedTag,
        style: selectedStyle,
        imageCount: imagesData.length
      });

      resultSection.style.display = 'block';
    } catch (err) {
      alert("エラー詳細: " + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
      spinnerWrap.style.display = 'none';
    }
  }

  function copyBoth() {
    const shortVal = document.getElementById('shortText').value;
    const longVal = document.getElementById('longText').value;

    // コピーした決定稿を文体学習のお手本として記録
    recordUserStyleExample(shortVal, longVal);

    const combined = `【X用】\n${shortVal}\n\n【詳細ログ】\n${longVal}`;
    navigator.clipboard.writeText(combined);
    alert("コピーしました！（直した文体をAIが学習しました）");
  }

  function saveToLocalHistory(record) {
    try {
      const history = JSON.parse(localStorage.getItem('my_life_logs') || '[]');
      history.unshift(record);
      if (history.length > 50) history.pop();
      localStorage.setItem('my_life_logs', JSON.stringify(history));
      renderHistory();
    } catch (e) {
      console.warn("ローカル保存に失敗しました", e);
    }
  }

  function renderHistory() {
    const listEl = document.getElementById('historyList');
    const badgeEl = document.getElementById('historyCountBadge');
    const history = JSON.parse(localStorage.getItem('my_life_logs') || '[]');
    
    badgeEl.innerText = `${history.length}件`;
    if (!history.length) {
      listEl.innerHTML = '<div style="font-size: 0.75rem; color: #94a3b8; text-align: center; padding: 10px;">まだ保存されたログがありません</div>';
      return;
    }

    listEl.innerHTML = history.slice(0, 10).map((item, idx) => `
      <div class="history-card">
        <div class="history-header">
          <span><span class="history-badge">${item.category}</span> ${item.tag}</span>
          <span>${item.date}</span>
        </div>
        <div class="history-text"><strong>X用:</strong> ${item.short_text}</div>
        <div class="history-btn-row">
          <button class="btn-mini-copy" onclick="copyHistoryItem(${idx}, 'short')">短文コピー</button>
          <button class="btn-mini-copy" onclick="copyHistoryItem(${idx}, 'long')">長文コピー</button>
        </div>
      </div>
    `).join('');
  }

  function copyHistoryItem(index, type) {
    const history = JSON.parse(localStorage.getItem('my_life_logs') || '[]');
    const item = history[index];
    if (!item) return;
    const text = type === 'short' ? item.short_text : item.long_text;
    navigator.clipboard.writeText(text);
    alert(`${type === 'short' ? '短文' : '長文'}をコピーしました！`);
  }

  function clearHistory() {
    if (confirm("スマホ内の履歴をすべて削除しますか？")) {
      localStorage.removeItem('my_life_logs');
      renderHistory();
    }
  }

  async function sendToDiscord() {
    const shortVal = document.getElementById('shortText').value;
    const longVal = document.getElementById('longText').value;

    // Discordへ送った決定稿もお手本として学習
    recordUserStyleExample(shortVal, longVal);

    const btn = document.getElementById('discordBtn');
    btn.disabled = true;
    btn.innerText = "画像と一緒に送信中...";

    const payload = {
      embeds: [{
        title: `📸 ${currentCategory}ログ（${selectedTag}）`,
        color: 15339532,
        fields: [
          { name: "📱 X用（短文）", value: shortVal || "なし" },
          { name: "📝 詳細アーカイブ（長文）", value: longVal || "なし" }
        ],
        footer: { text: `画像 ${imagesData.length} 枚を解析 | ${new Date().toLocaleString()}` }
      }]
    };

    const formData = new FormData();
    formData.append("payload_json", JSON.stringify(payload));

    for (let i = 0; i < imagesData.length; i++) {
      const byteCharacters = atob(imagesData[i].base64);
      const byteNumbers = new Array(byteCharacters.length);
      for (let j = 0; j < byteCharacters.length; j++) {
        byteNumbers[j] = byteCharacters.charCodeAt(j);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: imagesData[i].mimeType });
      formData.append(`files[${i}]`, blob, `photo_${i + 1}.jpg`);
    }

    try {
      const res = await fetch(DISCORD_WEBHOOK_URL, {
        method: "POST",
        body: formData
      });
      if (!res.ok) throw new Error("Discord送信エラー");
      alert("写真とテキストをDiscordに保存しました！（直した文体もAIが学習しました）");
    } catch (e) {
      alert("Discord送信に失敗しました。");
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.innerText = "💬 Discordへ保存";
    }
  }
</script>

</body>
</html>
