<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メシログ & ライフログ AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f5f7; color: #1e293b; padding: 16px; display: flex; justify-content: center; }
    .app-card { width: 100%; max-width: 480px; background: #ffffff; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1 { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-bottom: 4px; text-align: center; }
    .sub { font-size: 0.8rem; color: #64748b; text-align: center; margin-bottom: 16px; }

    .step-title { font-size: 0.85rem; font-weight: 700; color: #475569; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
    .badge { background: #ea580c; color: #fff; font-size: 0.7rem; border-radius: 50%; width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center; }

    .upload-zone { border: 2px dashed #cbd5e1; border-radius: 12px; padding: 16px; text-align: center; cursor: pointer; background: #f8fafc; margin-bottom: 16px; }
    .upload-zone input { display: none; }
    .preview-img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; display: none; margin-top: 8px; }

    .tag-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
    .tag-btn { border: 1px solid #cbd5e1; background: #ffffff; padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    .tag-btn.active { background: #ea580c; color: #ffffff; border-color: #ea580c; font-weight: 700; }

    .btn-main { width: 100%; background: #ea580c; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.3); }
    .btn-main:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

    .result-section { margin-top: 20px; display: none; }
    .detected-mode { font-size: 0.75rem; font-weight: 700; color: #ea580c; background: #fff7ed; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 10px; }
    
    .box-title { font-size: 0.8rem; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .output-box { width: 100%; border: 1px solid #e2e8f0; border-radius: 8px; padding: 10px; font-size: 0.85rem; line-height: 1.5; color: #0f172a; resize: vertical; margin-bottom: 8px; background: #fafafa; }
    
    .action-row { display: flex; gap: 8px; margin-bottom: 16px; }
    .btn-sub { flex: 1; padding: 8px; border-radius: 8px; font-size: 0.8rem; font-weight: 700; border: none; cursor: pointer; text-align: center; text-decoration: none; }
    .btn-x { background: #000000; color: #ffffff; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .btn-copy { background: #e2e8f0; color: #334155; }

    .loading { text-align: center; color: #ea580c; font-weight: 700; font-size: 0.9rem; margin-top: 16px; display: none; }
  </style>
</head>
<body>

<div class="app-card">
  <h1>メシログ & ライフログ</h1>
  <div class="sub">写真を選ぶだけでAIが自動判別して投稿作成</div>

  <div class="step-title"><span class="badge">1</span> 写真を選ぶ（料理・風景・人物・日常）</div>
  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <span id="uploadText">📷 タップして写真を選択</span>
    <input type="file" id="fileInput" accept="image/*" onchange="handleImage(event)">
    <img id="preview" class="preview-img" alt="プレビュー">
  </div>

  <div class="step-title"><span class="badge">2</span> 今日の満足度・気分（任意）</div>
  <div class="tag-container" id="tagList">
    <button class="tag-btn active" onclick="selectTag(this)">🔥 最高！</button>
    <button class="tag-btn" onclick="selectTag(this)">😋 うまい</button>
    <button class="tag-btn" onclick="selectTag(this)">☕ まったり</button>
    <button class="tag-btn" onclick="selectTag(this)">✨ 絶景・爽快</button>
    <button class="tag-btn" onclick="selectTag(this)">👍 リピ確定</button>
  </div>

  <div class="step-title"><span class="badge">3</span> AIで同時生成</div>
  <button id="generateBtn" class="btn-main" onclick="generatePosts()" disabled>AIでコメントを作成する</button>
  <div id="loading" class="loading">AIが写真を解析中...</div>

  <div id="resultSection" class="result-section">
    <span id="detectedMode" class="detected-mode">🍜 食レポモード</span>

    <div class="box-title">📱 X用（短文・130字以内）</div>
    <textarea id="shortText" class="output-box" rows="4"></textarea>
    <div class="action-row">
      <a id="xPostBtn" href="#" target="_blank" class="btn-sub btn-x">𝕏 にポストする</a>
      <button class="btn-sub btn-copy" onclick="copyText('shortText')">コピー</button>
    </div>

    <div class="box-title">📝 詳細アーカイブ用（制限なし長文）</div>
    <textarea id="longText" class="output-box" rows="7"></textarea>
    <div class="action-row">
      <button class="btn-sub btn-copy" onclick="copyText('longText')">長文をコピーする</button>
    </div>
  </div>
</div>

<script>
  const GEMINI_API_KEY = "AQ.Ab8RN6LVXXZj29RRtBS9eX4yFZIEtpAAKWxsrTgh8hhUp1uy-Q";
  let base64Image = null;
  let mimeType = "image/jpeg";
  let selectedTag = "🔥 最高！";

  function selectTag(btn) {
    document.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedTag = btn.innerText;
  }

  function handleImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    mimeType = file.type || "image/jpeg";
    const reader = new FileReader();
    reader.onload = function(e) {
      base64Image = e.target.result.split(',')[1];
      const preview = document.getElementById('preview');
      preview.src = e.target.result;
      preview.style.display = 'block';
      document.getElementById('uploadText').style.display = 'none';
      document.getElementById('generateBtn').disabled = false;
    };
    reader.readAsDataURL(file);
  }

  async function generatePosts() {
    if (!base64Image) return;

    const btn = document.getElementById('generateBtn');
    const loading = document.getElementById('loading');
    const resultSection = document.getElementById('resultSection');

    btn.disabled = true;
    loading.style.display = 'block';
    resultSection.style.display = 'none';

    const promptText = `
あなたはユーザー専属の有能な相棒AIです。
渡された写真を解析し、以下の指示に厳格に従ってJSONフォーマットのみで出力してください。

【1. シーン自動判別】
写真の内容を以下のいずれかに自動分類してください。
- "食レポ" (料理・お酒・スイーツなど)
- "風景・旅" (街並み・観光地・自然・ゴルフ場・車・移動など)
- "ポートレート" (人物・自撮り・友人との記念など)
- "日常" (ペット・小物・作業風景など)

【2. トーン＆執筆ルール】
気分タグ: "${selectedTag}"
- 食レポの場合: 具材の質感や麺・脂のシズル感をプロ目線で称賛し、推定カロリーとハッシュタグを添える。
- 風景・旅の場合: 光の差し込みや空気感、その場の情緒を短文日記にする。
- ポートレート・日常の場合: 軽妙で人間味あふれる温かいコメントにする。

【3. 出力フォーマット】
以下のキーを持つ純粋なJSONのみを返してください。余計な解説や\`\`\`jsonなどのマークダウン記法は含めないでください。
{"category":"食レポ","short_text":"X用短文130字以内","long_text":"詳細長文"}
`;

    try {
      // エンドポイントを安定版(v1)に設定
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${GEMINI_API_KEY}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{
            parts: [
              { text: promptText },
              { inline_data: { mime_type: mimeType, data: base64Image } }
            ]
          }]
        })
      });

      if (!response.ok) {
        const errorData = await response.json();
        throw new Error(errorData.error ? errorData.error.message : "API通信エラー");
      }

      const data = await response.json();
      let rawText = data.candidates[0].content.parts[0].text;
      rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
      const result = JSON.parse(rawText);

      document.getElementById('detectedMode').innerText = `🏷️ 自動判別: ${result.category}モード`;
      document.getElementById('shortText').value = result.short_text;
      document.getElementById('longText').value = result.long_text;

      const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(result.short_text)}`;
      document.getElementById('xPostBtn').href = tweetUrl;

      saveToHistory({
        date: new Date().toLocaleString(),
        category: result.category,
        short_text: result.short_text,
        long_text: result.long_text,
        tag: selectedTag
      });

      resultSection.style.display = 'block';
    } catch (err) {
      alert("エラー詳細: " + err.message);
      console.error(err);
    } finally {
      btn.disabled = false;
      loading.style.display = 'none';
    }
  }

  function copyText(id) {
    const el = document.getElementById(id);
    el.select();
    navigator.clipboard.writeText(el.value);
    alert("コピーしました！");
  }

  function saveToHistory(record) {
    try {
      const history = JSON.parse(localStorage.getItem('my_life_logs') || '[]');
      history.unshift(record);
      if (history.length > 50) history.pop();
      localStorage.setItem('my_life_logs', JSON.stringify(history));
    } catch (e) {
      console.warn("履歴の保存に失敗しました", e);
    }
  }
</script>

</body>
</html>
